spring.application.name=Atahad

spring.config.import=optional:classpath:application-local.properties

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/Atahad_db
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Enable SQL logging
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
# the eager relations are loaded 2 levels per query (MariaDB allows 61 tables in one join)
spring.jpa.properties.hibernate.max_fetch_depth=2
//update

# Error Handling Configuration
spring.web.error.include-message=always
spring.web.error.include-stacktrace=always

server.port=8080
spring.thymeleaf.cache=false

# AI (any OpenAI compatible API), the key comes from the environment variable AI_API_KEY
# without a key the app uses ready texts instead of the AI
#ai.url=https://api.openai.com/v1/chat/completions
#ai.model=gpt-4o-mini
#ai.api-key=${AI_API_KEY:}
# Gemini
ai.url=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
ai.model=gemini-3.5-flash-lite

# API Key
ai.api-key=${AI_API_KEY:}

# Google Calendar
google.calendar.client-id=${GOOGLE_CLIENT_ID:}
google.calendar.client-secret=${GOOGLE_CLIENT_SECRET:}
google.calendar.redirect-uri=http://localhost:8080/api/v1/google-calendar/callback
# encrypts the saved Google tokens (any long random text, keep it the same or the users link again)
google.calendar.encryption-key=${GOOGLE_CALENDAR_ENCRYPTION_KEY:}

# Google Places (the place search of a location goal)
google.places.api-key=${GOOGLE_PLACES_API_KEY:}

# WhatsApp with UltraMsg (n8n sends the queue with these, the backend only keeps them in one place)
ultramsg.api-url=${ULTRAMSG_API_URL:https://api.ultramsg.com}
ultramsg.instance-id=${ULTRAMSG_INSTANCE_ID:}
ultramsg.token=${ULTRAMSG_TOKEN:}

# every key above can come from an environment variable, or from your own application-local.properties
# (never committed): copy application-local.properties.example to application-local.properties and fill it

# n8n calls /api/v1/n8n/** with the header X-N8N-KEY (the key is in application-local.properties)
# when n8n runs the daily automation, make this false so it does not run twice
automation.scheduler-enabled=true

# the photos and videos of the moments (MomentService checks 20 MB)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Proof AI: free models only; never put a real key in tracked files.
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.models.text=${OPENROUTER_TEXT_MODEL:google/gemma-4-26b-a4b-it:free}
openrouter.models.vision=${OPENROUTER_VISION_MODEL:google/gemma-4-26b-a4b-it:free}
openrouter.models.timer=${OPENROUTER_TIMER_MODEL:google/gemma-4-26b-a4b-it:free}

# n8n weekly email reports
n8n.key=${N8N_KEY:}
# Ordered free alternatives; OpenRouter handles failover within one request.
openrouter.fallbacks.text=${OPENROUTER_TEXT_FALLBACKS:google/gemma-4-31b-it:free,nvidia/nemotron-3.5-super-vl:free}
openrouter.fallbacks.vision=${OPENROUTER_VISION_FALLBACKS:google/gemma-4-31b-it:free,nvidia/nemotron-3.5-super-vl:free}
openrouter.fallbacks.timer=${OPENROUTER_TIMER_FALLBACKS:google/gemma-4-31b-it:free,nvidia/nemotron-3.5-super-vl:free}
